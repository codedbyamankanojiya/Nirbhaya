name: nirbhaya
description: "Nirbhaya - Women's Safety & Emergency Assistance Platform"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.6.1
  go_router: ^14.8.1
  dio: ^5.7.0
  flutter_secure_storage: ^9.2.4
  json_annotation: ^4.9.0
  geolocator: ^13.0.2
  image_picker: ^1.1.2
  url_launcher: ^6.3.1
  permission_handler: ^11.3.1
  connectivity_plus: ^6.1.1
  cached_network_image: ^3.4.1
  shared_preferences: ^2.3.4
  intl: ^0.19.0
  google_fonts: ^6.2.1
  flutter_animate: ^4.5.2
  vibration: ^2.0.0
  flutter_map: ^7.0.2
  latlong2: ^0.9.1
  wakelock_plus: ^1.2.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  build_runner: ^2.4.13
  json_serializable: ^6.9.0
  mockito: ^5.4.4
  mocktail: ^1.0.4

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
